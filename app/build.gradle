plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lenovodock.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lenovodock.app'
        minSdk 29          // Lenovo TB-X306X — Android 10
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Compile to Java 17 bytecode. The Gradle daemon runs on JDK 25, but
    // targeting 17 keeps AGP/Kotlin on well-supported bytecode.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
}

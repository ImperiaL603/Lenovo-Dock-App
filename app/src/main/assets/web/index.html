<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Tablet Dashboard</title>

<!-- Quicksand from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/themes.css" />
<!-- Before alarms/settings: it holds the panel surface both of them share, and
     each of those files still overrides its own specifics on top. -->
<link rel="stylesheet" href="css/panels.css" />
<link rel="stylesheet" href="css/alarms.css" />
<link rel="stylesheet" href="css/settings.css" />
<link rel="stylesheet" href="css/spotify.css" />
<link rel="stylesheet" href="css/idle.css" />
</head>
<body>

  <video id="bg-video" class="bg-video" autoplay muted loop playsinline
       src="assets/video/endless-summer-horizon.1920x1080.mp4"></video>

  <!-- ===================== CLOCK ===================== -->
  <section id="clock-mode">

    <!-- Day, TIME, then date. The time used to sit third and at the same size as
         the date, so the one thing you glance at was the least emphasised on the
         screen. It now sits directly under the day — the two things read together —
         with the date demoted to quiet context beneath. -->
    <div class="clock-block" id="clock-block">
      <div class="clock-day" id="clock-day">Thursday</div>
      <div class="clock-time">
        <span class="clock-hm" id="clock-hm">2:36</span>
        <span class="clock-ampm" id="clock-ampm">AM</span>
      </div>
      <div class="clock-date" id="clock-date">17 July 2026</div>
      <!-- Below the time rather than between date and time: day/date/time read as
           one stack, and these are subordinate to all three. Filled by script.js;
           left empty when nothing is scheduled or running, which :empty hides. -->
      <div class="next-alarm" id="next-alarm"></div>
      <div class="next-timer" id="next-timer"></div>
    </div>

    <!-- Alarms / Timers panel: hidden until "+" is tapped -->
    <div class="panel" id="panel">
      <div class="panel-section">
        <div class="panel-section-header">
          <div class="panel-title">Alarms</div>
          <button class="panel-add-toggle" id="toggle-alarm-form">+ New</button>
        </div>
        <div class="inline-form" id="new-alarm-form">
          <input type="time" id="new-alarm-time" class="form-input" />
          <input type="text" id="new-alarm-label" class="form-input" placeholder="Label (optional)" />
          <!-- Same chip primitive as every settings row; data-day carries the
               Calendar constant and is what script.js selects on. -->
          <div class="option-row">
            <button class="option-chip" data-day="1">Sun</button>
            <button class="option-chip" data-day="2">Mon</button>
            <button class="option-chip" data-day="3">Tue</button>
            <button class="option-chip" data-day="4">Wed</button>
            <button class="option-chip" data-day="5">Thu</button>
            <button class="option-chip" data-day="6">Fri</button>
            <button class="option-chip" data-day="7">Sat</button>
          </div>
          <button class="form-save-btn" id="save-alarm-btn">Save Alarm</button>
        </div>
        <div class="panel-list" id="alarms-list">
          <div class="placeholder-row">No alarms set</div>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-section-header">
          <div class="panel-title">Timers</div>
          <button class="panel-add-toggle" id="toggle-timer-form">+ New</button>
        </div>
        <div class="inline-form" id="new-timer-form">
          <input type="number" id="new-timer-minutes" class="form-input" placeholder="Minutes" min="1" />
          <input type="text" id="new-timer-label" class="form-input" placeholder="Label (optional)" />
          <button class="form-save-btn" id="save-timer-btn">Start Timer</button>
        </div>
        <div class="panel-list" id="timers-list">
          <div class="placeholder-row">No timers running</div>
        </div>
      </div>
    </div>

    <button id="add-btn" class="add-btn" aria-label="Add alarm or timer">
      <span>+</span>
    </button>

  </section>

<!-- Settings panel: hidden until gear icon is tapped -->
<div class="settings-panel" id="settings-panel">
  <div class="settings-panel-title">Settings</div>
  <button class="settings-section-label" aria-expanded="false">
    Wallpaper
    <span class="section-chevron">&#9662;</span>
  </button>
  <!-- Wrapped like Appearance and Display so the section can hold more than the
       grid; the wrapper is what .settings-section-label toggles .open on. -->
  <div class="collapsible wallpaper-section">
    <div class="settings-subsection-label">Daily cycle</div>
    <div class="option-row" id="wallpaper-cycle-row">
      <button class="option-chip" data-cycle="off">Off</button>
      <button class="option-chip" data-cycle="on">On</button>
    </div>
    <div class="wallpaper-grid" id="wallpaper-grid"></div>
  </div>

  <button class="settings-section-label" aria-expanded="false">
    Appearance
    <span class="section-chevron">&#9662;</span>
  </button>
  <div class="collapsible">
    <div class="settings-subsection-label">Clock</div>
    <div class="option-row" data-scale="clock">
      <button class="option-chip" data-size="small">Small</button>
      <button class="option-chip" data-size="medium">Medium</button>
      <button class="option-chip" data-size="large">Large</button>
    </div>
    <div class="settings-subsection-label">Spotify</div>
    <div class="option-row" data-scale="spotify">
      <button class="option-chip" data-size="small">Small</button>
      <button class="option-chip" data-size="medium">Medium</button>
      <button class="option-chip" data-size="large">Large</button>
    </div>
    <!-- Lyrics scale on their own ladder, and a longer one: they are what you read
         from across the room, and the album art does not have to grow to suit. -->
    <div class="settings-subsection-label">Lyrics</div>
    <div class="option-row" data-scale="lyric">
      <button class="option-chip" data-size="small">Small</button>
      <button class="option-chip" data-size="medium">Medium</button>
      <button class="option-chip" data-size="large">Large</button>
      <button class="option-chip" data-size="xlarge">Huge</button>
      <button class="option-chip" data-size="max">Max</button>
    </div>
    <div class="settings-subsection-label">Theme</div>
    <div class="option-row" id="theme-row">
      <button class="option-chip" data-theme="mono">Mono</button>
      <button class="option-chip" data-theme="forest">Evergreen</button>
      <button class="option-chip" data-theme="ocean">Tide</button>
      <button class="option-chip" data-theme="sunset">Copper</button>
      <button class="option-chip" data-theme="berry">Plum</button>
      <button class="option-chip" data-theme="rose">Bloom</button>
      <button class="option-chip" data-theme="slate">Graphite</button>
      <button class="option-chip" data-theme="midnight">Indigo</button>
      <button class="option-chip" data-theme="ember">Rust</button>
    </div>
    <!-- When on, the playing album's colour overrides the theme above; the theme
         takes back over whenever there is no art to sample. -->
    <div class="settings-subsection-label">Album colours</div>
    <div class="option-row" id="albumcolour-row">
      <button class="option-chip" data-album="off">Off</button>
      <button class="option-chip" data-album="on">On</button>
    </div>
  </div>

  <button class="settings-section-label" aria-expanded="false">
    Display
    <span class="section-chevron">&#9662;</span>
  </button>
  <div class="collapsible">
    <div class="settings-subsection-label">Auto-dim</div>
    <div class="option-row" id="autodim-row">
      <button class="option-chip" data-autodim="off">Off</button>
      <button class="option-chip" data-autodim="on">On</button>
    </div>
    <!-- How dark the screen may get in an unlit room; the ceiling is always full. -->
    <div class="settings-subsection-label">Dimmest</div>
    <div class="option-row" id="dimfloor-row">
      <button class="option-chip" data-floor="5">5%</button>
      <button class="option-chip" data-floor="15">15%</button>
      <button class="option-chip" data-floor="30">30%</button>
    </div>
  </div>

  <button class="settings-section-label" aria-expanded="false">
    Audio
    <span class="section-chevron">&#9662;</span>
  </button>
  <div class="collapsible">
    <!-- Silences the music stream for the length of a Spotify ad break. State is
         held natively — MediaListenerService acts on it whether or not this page
         exists — so these chips are rendered from what native reports, not from
         localStorage. -->
    <div class="settings-subsection-label">Mute ads</div>
    <div class="option-row" id="admute-row">
      <button class="option-chip" data-admute="off">Off</button>
      <button class="option-chip" data-admute="on">On</button>
    </div>
  </div>

  <button class="settings-section-label" aria-expanded="false">
    Sleep
    <span class="section-chevron">&#9662;</span>
  </button>
  <div class="collapsible">
    <div class="option-row" id="sleep-row">
      <button class="option-chip" data-minutes="15">15 min</button>
      <button class="option-chip" data-minutes="30">30 min</button>
      <button class="option-chip" data-minutes="45">45 min</button>
      <button class="option-chip" data-minutes="60">60 min</button>
    </div>
    <div class="custom-row">
      <input type="number" id="sleep-custom-min" class="form-input" placeholder="Custom min" min="1" />
      <button class="form-save-btn" id="sleep-custom-set">Set</button>
    </div>
  </div>
</div>

<button id="settings-btn" class="settings-btn" aria-label="Open settings">
  <span>&#9881;</span>
</button>

<!-- Testing aid: jump between Clock and Spotify without waiting on playback.
     Lives outside both sections so it stays visible in either mode. -->
<button id="mode-btn" class="mode-btn">Spotify</button>

<!-- Sleep toggle: sits beside the gear, Spotify mode only. -->
<button id="sleep-btn" class="sleep-btn">Sleep</button>

<!-- Lyrics sync nudge. "+" brings the words forward (fixes lyrics running late),
     "-" pushes them back. Shown only while the track has timed lyrics to shift —
     see renderSync() in spotify.js. -->
<div id="sync-btn" class="sync-btn">
  <button class="sync-step" data-sync="-1" aria-label="Lyrics later">-</button>
  <span class="sync-value" id="sync-value">0.00s</span>
  <button class="sync-step" data-sync="1" aria-label="Lyrics earlier">+</button>
</div>

<!-- ===================== SPOTIFY ===================== -->
<section id="spotify-mode">
  <img class="spotify-bg" id="spotify-bg" alt="" />
  <div class="spotify-layout">

    <div class="player-column">
      <div class="album-art-box">
        <img id="album-art-img" alt="" />
        <div class="album-art-placeholder">Album Art</div>
      </div>
      <div class="song-name" id="song-name"></div>
      <div class="artist-names" id="artist-names"></div>
    </div>

    <div class="lyrics-column">
      <div class="playlist-name" id="playlist-name"></div>
      <div class="lyrics-window" id="lyrics-window"></div>
      <div class="up-next" id="up-next">
        <span class="up-next-label">Up Next</span>
        <span class="up-next-track" id="up-next-track"></span>
      </div>
    </div>

  </div>

  <!-- Centred on the screen rather than inside the player column. Siblings of
       .spotify-layout, so they are positioned against #spotify-mode. -->
  <div class="progress-row" id="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-times">
      <span class="progress-time" id="progress-elapsed">0:00</span>
      <span class="progress-time" id="progress-total">0:00</span>
    </div>
  </div>

  <div class="spotify-controls" id="spotify-controls">
    <button class="ctrl-btn" id="ctrl-prev" aria-label="Previous">&#9198;</button>
    <!-- Glyph is swapped by spotify.js to match playback state; nothing plays at boot. -->
    <button class="ctrl-btn" id="ctrl-playpause" aria-label="Play or pause">&#9654;</button>
    <button class="ctrl-btn" id="ctrl-next" aria-label="Next">&#9197;</button>
  </div>

</section>

<script src="js/wallpaper.js"></script>
<script src="js/script.js"></script>
<script src="js/spotify.js"></script>
<script src="js/sleep.js"></script>
<script src="js/idle.js"></script>
</body>
</html>

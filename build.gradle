// Root build file. Plugin versions are pinned here and applied per-module.
// AGP 8.12.0 + Kotlin 2.1.20 are the newest versions already resolved on this
// machine under Gradle 9.0.0 + JDK 25 (verified via the local Gradle cache).
plugins {
    id 'com.android.application' version '8.12.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
}

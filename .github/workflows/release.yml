# Builds a signed APK and attaches it to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The tag name (minus the leading "v") becomes versionName, and the workflow run
# number becomes versionCode — so every release is higher than the last and Android
# will accept it as an update.
#
# Needs four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD. Without them the build still runs but produces an unsigned APK,
# which will not install — so the workflow fails early instead, with a clear reason.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # matches the project's jvmTarget

      - uses: gradle/actions/setup-gradle@v4

      - name: Fail early if the signing secrets are missing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set. An unsigned APK cannot be installed."
            echo "See the Releases section of README.md for how to add the four secrets."
            exit 1
          fi

      # Written to RUNNER_TEMP, not the workspace, so it can never be picked up by
      # a later step that archives the checkout.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PappVersionName="${GITHUB_REF_NAME#v}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Name the APK after the version
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "lenovo-dock-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: lenovo-dock-*.apk
          generate_release_notes: true

      # The runner is destroyed after the job, but an explicit delete costs nothing
      # and keeps the key out of any artifact a future step might upload.
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
